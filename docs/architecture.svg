<text x="30" y="42" font-size="24" font-weight="700" fill="#f8fafc">cpp-calculator</text>
<text x="30" y="68" font-size="14" fill="#94a3b8">C++ · g++ · Git &amp; GitHub practical · UET Taxila</text>
